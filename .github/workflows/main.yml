name: Build and Release

on:
  push:
    tags:
      - 'v*'  
  workflow_dispatch:  

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  github_env:
    name: GitHub Env Debug
    runs-on: ubuntu-latest
    steps:
      - name: Dump github context
        run: echo "$GITHUB_CONTEXT"
        shell: bash
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}

  setup_release:
    name: Setup Release
    outputs:
      publish_release: ${{ steps.setup_release_auto.outputs.publish_release || steps.setup_release_tag.outputs.publish_release || steps.setup_release_manual.outputs.publish_release }}
      release_body: ${{ steps.setup_release_auto.outputs.release_body || steps.setup_release_tag.outputs.release_body || steps.setup_release_manual.outputs.release_body }}
      release_commit: ${{ steps.setup_release_auto.outputs.release_commit || steps.setup_release_tag.outputs.release_commit || steps.setup_release_manual.outputs.release_commit }}
      release_generate_release_notes: ${{ steps.setup_release_auto.outputs.release_generate_release_notes || steps.setup_release_tag.outputs.release_generate_release_notes || steps.setup_release_manual.outputs.release_generate_release_notes }}
      release_tag: ${{ steps.setup_release_auto.outputs.release_tag || steps.setup_release_tag.outputs.release_tag || steps.setup_release_manual.outputs.release_tag }}
      release_version: ${{ steps.setup_release_auto.outputs.release_version || steps.setup_release_tag.outputs.release_version || steps.setup_release_manual.outputs.release_version }}
    permissions:
      contents: write  # read does not work to check squash and merge details
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug GitHub Event
        run: |
          echo "GitHub Event Name: ${{ github.event_name }}"
          echo "Has commits field: ${{ contains(toJson(github.event), 'commits') }}"

      - name: Setup Release (Auto)
        id: setup_release_auto
        # 只在非 tag 的 push 事件时使用此 action（如 squash merge 到 main）
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: LizardByte/setup-release-action@v2025.426.225
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Release (Tag Push)
        id: setup_release_tag
        # Tag push 时直接使用 tag 名称
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "publish_release=true" >> $GITHUB_OUTPUT
          echo "release_body=Release ${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_commit=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "release_generate_release_notes=true" >> $GITHUB_OUTPUT
          echo "release_tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_version=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Setup Release (Manual)
        id: setup_release_manual
        if: github.event_name == 'workflow_dispatch'
        run: |
          # 为手动构建设置默认值
          echo "publish_release=false" >> $GITHUB_OUTPUT
          echo "release_body=Manual build" >> $GITHUB_OUTPUT
          echo "release_commit=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "release_generate_release_notes=false" >> $GITHUB_OUTPUT
          echo "release_tag=manual-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          echo "release_version=manual-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT

  build_win:
    name: Windows
    needs: setup_release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Dependencies Windows
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          install: >-
            wget

      - name: Update Windows dependencies
        shell: bash
        run: bash scripts/setup_deps.sh

      - name: Install Rust (for Tauri GUI)
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://win.rustup.rs/x86_64 -o rustup-init.exe
          ./rustup-init.exe -y --default-toolchain stable --profile minimal
          rm rustup-init.exe

      - name: Build Windows
        shell: bash
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          BUILD_VERSION: ${{ needs.setup_release.outputs.release_tag }}.custom
          COMMIT: ${{ needs.setup_release.outputs.release_commit }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: bash scripts/build_win.sh

      - name: Package Windows
        shell: bash
        run: |
          export PATH="/c/msys64/ucrt64/bin:/c/msys64/usr/bin:$PATH"
          mkdir -p artifacts
          cd build
          cpack -G NSIS --config ./CPackConfig.cmake --verbose
          cpack -G ZIP --config ./CPackConfig.cmake --verbose
          mv ./cpack_artifacts/Sunshine.exe ../artifacts/sunshine-windows-installer.exe
          mv ./cpack_artifacts/Sunshine.zip ../artifacts/sunshine-windows-portable.zip

      - name: Generate Checksums
        shell: pwsh
        run: |
          # 生成 SHA256 校验和
          .\scripts\generate-checksums.ps1 -Path .\artifacts -Output "SHA256SUMS.txt"

      - name: Package Windows Debug Info
        working-directory: build
        run: |
          # use .dbg file extension for binaries to avoid confusion with real packages
          Get-ChildItem -File -Recurse | `
            % { Rename-Item -Path $_.PSPath -NewName $_.Name.Replace(".exe",".dbg") }

          # save the binaries with debug info
          7z -r `
            "-xr!CMakeFiles" `
            "-xr!cpack_artifacts" `
            a "../artifacts/sunshine-win32-debuginfo.7z" "*.dbg"

      - name: Rename release assets
        shell: bash
        run: |
          export PATH="/c/msys64/ucrt64/bin:/c/msys64/usr/bin:$PATH"
          TAG="${{ needs.setup_release.outputs.release_tag }}"
          NEWTAG="$TAG"

          if [[ "$TAG" =~ ^v([0-9]{4})\.([0-9]+) ]]; then
            YEAR="${BASH_REMATCH[1]}"
            DATE_PART="${BASH_REMATCH[2]}"
            DATE_PADDED=$(printf "%04d" "$DATE_PART")
            NEWTAG="v${YEAR}.${DATE_PADDED}"
          fi

          # 重命名安装包和便携版
          mv artifacts/sunshine-windows-installer.exe "artifacts/Sunshine.${NEWTAG}.WindowsInstaller.exe"
          mv artifacts/sunshine-windows-portable.zip "artifacts/Sunshine.${NEWTAG}.WindowsPortable.zip"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sunshine-windows
          path: |
            artifacts/Sunshine.*.WindowsInstaller.exe
            artifacts/Sunshine.*.WindowsPortable.zip
            artifacts/SHA256SUMS.txt
            artifacts/checksums.json
          if-no-files-found: error

      - name: Create/Update GitHub Release
        if: needs.setup_release.outputs.publish_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.setup_release.outputs.release_tag }}
          name: ${{ needs.setup_release.outputs.release_tag }}
          body: ${{ needs.setup_release.outputs.release_body }}
          generate_release_notes: ${{ needs.setup_release.outputs.release_generate_release_notes }}
          prerelease: true
          files: |
            artifacts/Sunshine.*.WindowsInstaller.exe
            artifacts/Sunshine.*.WindowsPortable.zip
            artifacts/SHA256SUMS.txt
            artifacts/checksums.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
